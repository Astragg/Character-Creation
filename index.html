<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Odds Duel | Risk & Strategy</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --accent: #38bdf8;
            --dm-color: #f43f5e;
            --player-color: #10b981;
            --text: #f1f5f9;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Header & Info */
        header {
            background: var(--card);
            padding: 1rem;
            text-align: center;
            border-bottom: 2px solid var(--accent);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .game-link { font-size: 0.8rem; color: var(--accent); cursor: pointer; }

        /* Main Layout */
        main {
            display: grid;
            grid-template-columns: 1fr 350px 1fr;
            flex: 1;
            gap: 1rem;
            padding: 1rem;
        }

        .side-panel {
            background: var(--card);
            border-radius: 12px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            border: 2px solid transparent;
        }

        .side-panel.active-role { border-color: var(--accent); box-shadow: 0 0 15px rgba(56, 189, 248, 0.2); }
        .dm-border { border-top: 5px solid var(--dm-color); }
        .player-border { border-top: 5px solid var(--player-color); }

        /* Center Panel */
        .center-panel {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        #log {
            flex: 1;
            background: #000;
            border-radius: 8px;
            padding: 1rem;
            font-family: monospace;
            font-size: 0.9rem;
            overflow-y: auto;
            color: #adbac7;
            border: 1px solid #334155;
        }

        /* Controls */
        .controls { display: flex; flex-direction: column; gap: 1rem; }
        .stat-box { font-size: 1.5rem; font-weight: bold; text-align: center; margin-bottom: 1rem; }
        
        .risk-buttons { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.5rem; }
        button {
            padding: 0.8rem;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.1s, opacity 0.2s;
        }

        button:active { transform: scale(0.95); }
        button:disabled { opacity: 0.3; cursor: not-allowed; }

        .btn-low { background: #4ade80; color: #064e3b; }
        .btn-med { background: #fbbf24; color: #78350f; }
        .btn-high { background: #f87171; color: #7f1d1d; }
        .btn-lock { background: var(--accent); color: #0f172a; margin-top: 1rem; width: 100%; }
        .btn-special { background: #a855f7; color: white; font-size: 0.7rem; }

        input[type="range"] { width: 100%; accent-color: var(--accent); }

        .status-tag {
            text-align: center;
            padding: 0.5rem;
            border-radius: 4px;
            background: #334155;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .reveal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
            font-size: 3rem;
            font-weight: bold;
            text-align: center;
        }

        /* Hidden data for DM */
        .dm-spy { font-size: 0.8rem; color: #94a3b8; font-style: italic; margin-top: 0.5rem; }

        @media (max-width: 900px) {
            main { grid-template-columns: 1fr; overflow-y: auto; }
            .center-panel { order: -1; height: 300px; }
        }
    </style>
</head>
<body>

<header>
    <div><strong>ODDS DUEL</strong></div>
    <div id="phase-display" class="status-tag">INITIALIZING...</div>
    <div class="game-link" id="copy-link">Copy Join Link</div>
</header>

<main>
    <div id="panel-dm" class="side-panel dm-border">
        <h2 style="color: var(--dm-color)">Dealer (DM)</h2>
        <div id="dm-points" class="stat-box">100</div>
        <div class="controls" id="dm-controls">
            <label>Bet: <span id="dm-bet-val">10</span></label>
            <input type="range" id="dm-bet" min="1" max="20" value="10">
            <div class="risk-buttons">
                <button class="btn-low" onclick="setRisk('dm', 'low')">70%</button>
                <button class="btn-med" onclick="setRisk('dm', 'med')">50%</button>
                <button class="btn-high" onclick="setRisk('dm', 'high')">30%</button>
            </div>
            <div id="dm-selection-display" style="font-size: 0.8rem;">Selected: None</div>
            <button id="dm-lock" class="btn-lock">LOCK IN</button>
            
            <hr style="border: 0.5px solid #334155; width: 100%;">
            <div style="font-size: 0.8rem; margin-bottom: 0.5rem;">Abilities (Once per match):</div>
            <div class="risk-buttons">
                <button class="btn-special" id="ability-luck" onclick="useAbility('luck')">LUCK SURGE</button>
                <button class="btn-special" id="ability-lock" onclick="useAbility('lock')">RISK LOCK</button>
                <button class="btn-special" id="ability-chaos" onclick="useAbility('chaos')">CHAOS</button>
            </div>
            <div id="spy-glass" class="dm-spy">Waiting for player...</div>
        </div>
    </div>

    <div class="center-panel">
        <div id="log">Welcome to Odds Duel. Waiting for players...</div>
        <div id="round-counter" style="text-align: center; font-weight: bold;">Round 1</div>
        <button id="next-round-btn" class="btn-lock" style="display:none; background: #fff;">START NEXT ROUND</button>
    </div>

    <div id="panel-player" class="side-panel player-border">
        <h2 style="color: var(--player-color)">Player</h2>
        <div id="player-points" class="stat-box">100</div>
        <div class="controls" id="player-controls">
            <label>Bet: <span id="player-bet-val">10</span></label>
            <input type="range" id="player-bet" min="1" max="20" value="10">
            <div class="risk-buttons">
                <button class="btn-low" onclick="setRisk('player', 'low')">70%</button>
                <button class="btn-med" onclick="setRisk('player', 'med')">50%</button>
                <button class="btn-high" onclick="setRisk('player', 'high')">30%</button>
            </div>
            <div id="player-selection-display" style="font-size: 0.8rem;">Selected: None</div>
            <button id="player-lock" class="btn-lock">LOCK IN</button>
        </div>
    </div>
</main>

<div id="reveal-overlay" class="reveal-overlay">REVEALING...</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, onSnapshot, updateDoc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDCrKQVcGBW4iy7OMAtn4JCF1ot5CGALBE",
        authDomain: "highnoon-66ee0.firebaseapp.com",
        databaseURL: "https://highnoon-66ee0-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "highnoon-66ee0",
        storageBucket: "highnoon-66ee0.firebasestorage.app",
        messagingSenderId: "754268761672",
        appId: "1:754268761672:web:7fbf59d2c403b43356727d"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // --- GAME STATE VARIABLES ---
    const urlParams = new URLSearchParams(window.location.search);
    let gameId = urlParams.get('g');
    const myRole = urlParams.get('role') === 'dm' ? 'dm' : 'player';
    
    if (!gameId) {
        gameId = Math.random().toString(36).substring(2, 9);
        window.history.replaceState({}, '', `?g=${gameId}&role=${myRole}`);
    }

    const gameRef = doc(db, "games", gameId);
    let gameState = null;
    let localSelections = { bet: 10, risk: 'med' };

    const RISK_DATA = {
        low: { chance: 0.7, mult: 1.3 },
        med: { chance: 0.5, mult: 1.8 },
        high: { chance: 0.3, mult: 2.5 }
    };

    // --- INITIALIZATION ---
    async function initGame() {
        const snap = await getDoc(gameRef);
        if (!snap.exists()) {
            await setDoc(gameRef, {
                state: { roundNumber: 1, phase: 'betting', abilityActive: null, lastAbilityUsed: null },
                players: {
                    dm: { points: 100, choice: null, locked: false },
                    player: { points: 100, choice: null, locked: false }
                },
                seed: Math.random()
            });
        }
        
        // Setup UI for role
        document.getElementById(`panel-${myRole}`).classList.add('active-role');
        if (myRole === 'player') {
            document.getElementById('dm-controls').style.pointerEvents = 'none';
            document.getElementById('dm-controls').style.opacity = '0.5';
        } else {
            document.getElementById('player-controls').style.pointerEvents = 'none';
            document.getElementById('player-controls').style.opacity = '0.5';
        }

        listenToGame();
    }

    function listenToGame() {
        onSnapshot(gameRef, (doc) => {
            gameState = doc.data();
            updateUI();
            checkPhaseTransitions();
        });
    }

    // --- CORE LOGIC ---
    function updateUI() {
        const { state, players } = gameState;
        
        document.getElementById('phase-display').innerText = state.phase;
        document.getElementById('round-counter').innerText = `Round ${state.roundNumber}`;
        document.getElementById('dm-points').innerText = players.dm.points;
        document.getElementById('player-points').innerText = players.player.points;

        // DM Spy Glass
        if (myRole === 'dm') {
            const pChoice = players.player.choice;
            document.getElementById('spy-glass').innerText = pChoice 
                ? `Spy: Player picking ${pChoice.risk} (${pChoice.bet} pts)` 
                : "Spy: Player thinking...";
        }

        // Lock Buttons
        document.getElementById('dm-lock').disabled = players.dm.locked || state.phase !== 'betting';
        document.getElementById('player-lock').disabled = players.player.locked || state.phase !== 'betting';
        
        if(players.dm.locked) document.getElementById('dm-lock').innerText = "LOCKED";
        if(players.player.locked) document.getElementById('player-lock').innerText = "LOCKED";

        // Ability buttons
        if (myRole === 'dm') {
            ['luck', 'lock', 'chaos'].forEach(a => {
                const btn = document.getElementById(`ability-${a}`);
                if (state.lastAbilityUsed === a) btn.style.display = 'none';
                if (state.phase !== 'betting') btn.disabled = true;
            });
        }

        // Show/Hide Next Round (DM Only)
        document.getElementById('next-round-btn').style.display = (state.phase === 'result' && myRole === 'dm') ? 'block' : 'none';
    }

    async function checkPhaseTransitions() {
        const { state, players } = gameState;

        if (state.phase === 'betting' && players.dm.locked && players.player.locked) {
            if (myRole === 'dm') {
                await updateDoc(gameRef, { "state.phase": 'reveal' });
                runResolution();
            }
        }
    }

    async function runResolution() {
        document.getElementById('reveal-overlay').style.display = 'flex';
        
        setTimeout(async () => {
            const { players, state, seed } = gameState;
            const rng = mulberry32(seed + state.roundNumber);
            
            const results = {
                dm: resolveBet('dm', players.dm.choice, rng(), state.abilityActive),
                player: resolveBet('player', players.player.choice, rng(), state.abilityActive)
            };

            const logMsg = `ROUND ${state.roundNumber} RESULTS:\n` +
                `DM: ${results.dm.win ? 'WIN' : 'LOSS'} (${results.dm.diff} pts)\n` +
                `Player: ${results.player.win ? 'WIN' : 'LOSS'} (${results.player.diff} pts)`;

            addLog(logMsg);

            await updateDoc(gameRef, {
                "players.dm.points": players.dm.points + results.dm.diff,
                "players.player.points": players.player.points + results.player.diff,
                "state.phase": 'result',
                "state.abilityActive": null
            });
            
            document.getElementById('reveal-overlay').style.display = 'none';
        }, 2000);
    }

    function resolveBet(role, choice, roll, activeAbility) {
        let { bet, risk } = choice;
        
        // Ability: Chaos
        if (activeAbility === 'chaos') {
            bet = Math.floor(Math.random() * 20) + 1;
            addLog(`!! Chaos !! ${role} bet randomized to ${bet}`);
        }

        let chance = RISK_DATA[risk].chance;
        
        // Ability: Luck Surge
        if (activeAbility === 'luck') chance += 0.1;

        const win = roll <= chance;
        const diff = win ? Math.floor(bet * RISK_DATA[risk].mult) : -bet;
        return { win, diff };
    }

    // --- HELPER FUNCTIONS ---
    function mulberry32(a) {
        return function() {
          var t = a += 0x6D2B79F5;
          t = Math.imul(t ^ t >>> 15, t | 1);
          t ^= t + Math.imul(t ^ t >>> 7, t | 61);
          return ((t ^ t >>> 14) >>> 0) / 4294967296;
        }
    }

    function addLog(msg) {
        const log = document.getElementById('log');
        log.innerHTML += `<div>> ${msg}</div>`;
        log.scrollTop = log.scrollHeight;
    }

    // --- EVENT LISTENERS ---
    window.setRisk = (role, tier) => {
        if (role !== myRole) return;
        localSelections.risk = tier;
        document.getElementById(`${role}-selection-display`).innerText = `Selected: ${tier.toUpperCase()}`;
        
        // Update Firestore immediately for DM spy advantage
        updateDoc(gameRef, { [`players.${myRole}.choice`]: { ...localSelections } });
    };

    document.getElementById(`${myRole}-bet`).addEventListener('input', (e) => {
        const val = e.target.value;
        document.getElementById(`${myRole}-bet-val`).innerText = val;
        localSelections.bet = parseInt(val);
        updateDoc(gameRef, { [`players.${myRole}.choice`]: { ...localSelections } });
    });

    document.getElementById(`${myRole}-lock`).addEventListener('click', () => {
        updateDoc(gameRef, { [`players.${myRole}.locked`]: true });
    });

    window.useAbility = (type) => {
        if (myRole !== 'dm') return;
        updateDoc(gameRef, { 
            "state.abilityActive": type, 
            "state.lastAbilityUsed": type 
        });
        addLog(`DM triggered ${type.toUpperCase()}!`);
    };

    document.getElementById('next-round-btn').addEventListener('click', () => {
        updateDoc(gameRef, {
            "state.phase": 'betting',
            "state.roundNumber": gameState.state.roundNumber + 1,
            "players.dm.locked": false,
            "players.player.locked": false,
            "players.dm.choice": null,
            "players.player.choice": null
        });
    });

    document.getElementById('copy-link').addEventListener('click', () => {
        const joinLink = window.location.origin + window.location.pathname + `?g=${gameId}`;
        navigator.clipboard.writeText(joinLink);
        alert("Join link copied! Send this to the Player.");
    });

    initGame();

</script>
</body>
</html>
