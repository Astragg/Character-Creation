<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Athletic Performance Tracker</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary: #ff4757;
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
        }
        body { font-family: -apple-system, system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: auto; }
        .card { background: var(--card); padding: 20px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        h1, h2 { color: var(--primary); }
        .day-nav { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 20px; }
        .day-btn { background: #334155; border: none; color: white; padding: 10px 15px; border-radius: 8px; cursor: pointer; white-space: nowrap; }
        .day-btn.active { background: var(--primary); }
        .exercise-item { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #334155; }
        input[type="checkbox"] { transform: scale(1.5); accent-color: var(--primary); }
        .weight-input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white; margin-top: 10px; box-sizing: border-box; }
        .btn-save { background: var(--primary); color: white; border: none; width: 100%; padding: 12px; border-radius: 8px; margin-top: 10px; font-weight: bold; cursor: pointer; }
        canvas { margin-top: 20px; background: #1e293b; border-radius: 8px; padding: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Performance Tracker</h1>

    <div class="card">
        <h2>Weight Log</h2>
        <input type="number" id="weightInput" class="weight-input" placeholder="Enter weight (kg/lbs)">
        <button class="btn-save" onclick="saveWeight()">Log Weight</button>
        <canvas id="weightChart"></canvas>
    </div>

    <div class="day-nav" id="dayNav"></div>
    <div id="workoutContent" class="card">
        <h2 id="dayTitle">Select a Day</h2>
        <div id="exerciseList"></div>
    </div>
</div>

<script>
    const workoutPlan = {
        1: { name: "Day 1: Lower Power", exercises: ["Split squats (12 each)", "Jump squats (10)", "Glute bridges (15)", "Split squat jumps (8 each)", "Wall sit (45s)", "Fast high knees (30s)"] },
        2: { name: "Day 2: Upper + Core", exercises: ["Push-ups (12-15)", "Decline push-ups (8-12)", "Sit-ups (20)", "Plank (45s)", "Shoulder taps (20)", "Fast push-ups (30s)", "Mountain climbers (30s)"] },
        3: { name: "Day 3: Plyo + HIIT", exercises: ["Jump squats (10)", "Burpees (8-12)", "Split squat jumps (8 each)", "High knees (30s)", "HIIT Sprints (8 rounds)"] },
        4: { name: "Day 4: Lower Strength", exercises: ["Slow split squats (10 each)", "Single-leg glute bridges (10 each)", "Squats (Pause)", "Calf raises (20)", "Jump squats (8)", "Hold squat (20s)"] },
        5: { name: "Day 5: Upper Explosive", exercises: ["Explosive push-ups (8-10)", "Normal push-ups (12-15)", "Pike push-ups (8-12)", "Sit-ups (15-20)", "Plank (45s)", "Push-up hold (20s)", "Shoulder taps (30s)"] },
        6: { name: "Day 6: Athletic + Core", exercises: ["Mountain climbers (30s)", "Jump squats (10)", "Sit-ups (20)", "Plank (45s)", "High knees (30s)", "Nonstop Movement (5 min)"] }
    };

    let weightData = JSON.parse(localStorage.getItem('weightLogs')) || [];
    let completedWorkouts = JSON.parse(localStorage.getItem('completedWorkouts')) || {};

    function init() {
        const nav = document.getElementById('dayNav');
        for (let i = 1; i <= 6; i++) {
            const btn = document.createElement('button');
            btn.className = 'day-btn';
            btn.innerText = `Day ${i}`;
            btn.onclick = () => loadDay(i);
            nav.appendChild(btn);
        }
        updateChart();
    }

    function loadDay(dayNum) {
        document.querySelectorAll('.day-btn').forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');

        const day = workoutPlan[dayNum];
        document.getElementById('dayTitle').innerText = day.name;
        const list = document.getElementById('exerciseList');
        list.innerHTML = '';

        day.exercises.forEach((ex, idx) => {
            const item = document.createElement('div');
            item.className = 'exercise-item';
            const isChecked = completedWorkouts[`${dayNum}-${idx}`] ? 'checked' : '';
            item.innerHTML = `<span>${ex}</span> <input type="checkbox" ${isChecked} onchange="toggleEx(${dayNum}, ${idx})">`;
            list.appendChild(item);
        });
    }

    function toggleEx(day, idx) {
        const key = `${day}-${idx}`;
        completedWorkouts[key] = !completedWorkouts[key];
        localStorage.setItem('completedWorkouts', JSON.stringify(completedWorkouts));
    }

    function saveWeight() {
        const weight = document.getElementById('weightInput').value;
        if (!weight) return;
        const entry = { date: new Date().toLocaleDateString(), weight: parseFloat(weight) };
        weightData.push(entry);
        localStorage.setItem('weightLogs', JSON.stringify(weightData));
        updateChart();
    }

    function updateChart() {
        const ctx = document.getElementById('weightChart').getContext('2d');
        if (window.myChart) window.myChart.destroy();
        window.myChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: weightData.map(d => d.date),
                datasets: [{
                    label: 'Weight',
                    data: weightData.map(d => d.weight),
                    borderColor: '#ff4757',
                    tension: 0.1
                }]
            },
            options: { scales: { y: { beginAtZero: false } } }
        });
    }

    init();
</script>
</body>
</html>
